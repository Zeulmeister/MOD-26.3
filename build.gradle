plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'AzureDoom'
        url = 'https://maven.azuredoom.com/mods'
    }
    maven {
        name = 'Ladysnake'
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    maven {
        name = 'KosmX'
        url = 'https://maven.kosmx.dev/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/jcraft.classtweaker")
    runs {
        client {
            if (System.getProperty("jcraft.selftest.client") != null) {
                vmArg "-Djcraft.selftest.client=" + System.getProperty("jcraft.selftest.client")
            }
            if (System.getProperty("jcraft.selftest.client.outdir") != null) {
                vmArg "-Djcraft.selftest.client.outdir=" + System.getProperty("jcraft.selftest.client.outdir")
            }
        }
        server {
            if (System.getProperty("jcraft.selftest.allstands") != null) {
                vmArg "-Djcraft.selftest.allstands=" + System.getProperty("jcraft.selftest.allstands")
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Self-contained Jar-in-Jar runtime dependencies so a single .jar works out-of-the-box
    include implementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")
    include implementation("maven.modrinth:architectury-api:${project.architectury_modrinth}")
    include implementation("mod.azure.azurelib:azurelib-fabric-26.3:${project.azurelib_version}")
    include implementation("maven.modrinth:player-animation-library:${project.player_anim_modrinth}")
    include implementation("org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}")
    include implementation("org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}")
    include implementation("org.ladysnake.cardinal-components-api:cardinal-components-level:${project.cca_version}")
    include implementation("maven.modrinth:cloth-config:${project.cloth_config_modrinth}")
    include implementation("maven.modrinth:terrablender:${project.terrablender_modrinth}")

    // Optional ModMenu integration
    compileOnly "maven.modrinth:modmenu:${project.modmenu_modrinth}"

    // Compile-only Guava annotation dependency (silences transitive j2objc ReflectionSupport$Level warning; never bundled)
    compileOnly "com.google.j2objc:j2objc-annotations:3.0.0"

    // Lombok for clean data/builder classes on JDK 25
    compileOnly "org.projectlombok:lombok:${project.lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"
    testCompileOnly "org.projectlombok:lombok:${project.lombok_version}"
    testAnnotationProcessor "org.projectlombok:lombok:${project.lombok_version}"
}

processResources {
    def modVersion = project.version
    inputs.property "version", modVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
    it.options.compilerArgs.addAll(["-Xmaxerrs", "2000", "-Xlint:removal", "-Xlint:deprecation", "-Xlint:unchecked"])
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Reproducible, deterministic JAR builds (stable SHA-256 across rebuilds)
tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.withType(org.gradle.jvm.tasks.Jar).configureEach {
    it.zip64 = true
}

tasks.register('verifyMod', JavaExec) {
    group = 'verification'
    description = 'Runs the JCraft 26.3 asset, metadata, Mixin, Dedicated-Server Isolation, and combat/UI verification suite.'
    dependsOn testClasses, processResources
    classpath = sourceSets.test.output + sourceSets.main.output + sourceSets.main.compileClasspath
    mainClass = 'net.arna.jcraft.JCraft263ValidationTest'
}

// Wire standard `./gradlew test` and `./gradlew check` directly to verifyMod
tasks.named('test') {
    enabled = false
    dependsOn 'verifyMod'
}

tasks.named('check') {
    dependsOn 'verifyMod'
}

tasks.register('deployMod') {
    group = 'distribution'
    description = 'Copies the built JCraft 26.3 JAR to the repository root and any paths specified via -Pjcraft.deploy.targets (semicolon-separated).'
    dependsOn 'build'
    doLast {
        def builtJar = tasks.named('jar').get().archiveFile.get().asFile
        def targets = [file("${projectDir}/jcraft-fabric-26.3.jar")]
        def extra = project.findProperty('jcraft.deploy.targets')?.toString()
        if (extra) {
            extra.split(';').each { raw ->
                def trimmed = raw.trim()
                if (trimmed) {
                    targets << file(trimmed)
                }
            }
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        def hashHex = { File f ->
            digest.reset()
            f.withInputStream { is ->
                byte[] buf = new byte[8192]
                int n
                while ((n = is.read(buf)) > 0) digest.update(buf, 0, n)
            }
            digest.digest().collect { String.format('%02X', it) }.join('')
        }
        def srcHash = hashHex(builtJar)
        println "Built JAR SHA-256: ${srcHash} (${builtJar})"
        targets.each { File dest ->
            dest.parentFile?.mkdirs()
            dest.bytes = builtJar.bytes
            def dstHash = hashHex(dest)
            if (dstHash != srcHash) {
                throw new GradleException("SHA-256 mismatch after deploy to ${dest}: expected ${srcHash}, got ${dstHash}")
            }
            println "Deployed OK (${dstHash}) -> ${dest}"
        }
    }
}
